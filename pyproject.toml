[project]
name = "recipe-optimizer"
version = "0.0.1"
description = "Personalized recipe optimization via LLM-assisted DAG rewriting under cooking constraints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
local-llm = [
    # HuggingFace transformers backend (heavy, optional)
    "transformers>=4.40",
    "torch>=2.2",
    "accelerate>=0.27",
]
gguf = [
    # CPU-friendly local inference via GGUF quantized models
    "llama-cpp-python>=0.2.70",
]

[project.scripts]
recipe-optimizer = "recipe_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_optimizer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
